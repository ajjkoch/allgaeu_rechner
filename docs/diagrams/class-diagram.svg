<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-labelledby="title desc">
<title id="title">AllgäuRechner – Klassendiagramm</title><desc id="desc">UML-Klassendiagramm der zentralen Klassen MainWindow, Calculator, Parser und AllgaeuButton mit Qt-Basisklassen und Beziehungen.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker><style>
text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:25px;font-weight:bold}.box{fill:#fff;stroke:#526477;stroke-width:1.8}.head{fill:#eaf0f5;stroke:#526477;stroke-width:1.8}.name{font-size:18px;font-weight:bold}.stereo{font-size:12px;fill:#526477}.attr{font-size:13px}.op{font-size:13px}.line{stroke:#526477;stroke-width:1.8;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:7 5}.note{fill:#fffdf2;stroke:#b6a36a;stroke-width:1.4}.small{font-size:12px;fill:#526477}</style></defs>
