name: Calculator CI

# Regression tests also run on the design branch.

on:
  push:
    branches:
      - main
      - refactor_design
    paths:
      - "common/Util.h"
      - "common/test_common.cmake"
      - "instructor/Calculator_cmake/**"
      - ".github/workflows/calculator.yml"
  pull_request:
    paths:
      - "common/Util.h"
      - "common/test_common.cmake"
      - "instructor/Calculator_cmake/**"
      - ".github/workflows/calculator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Qt 6 / CMake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            ninja-build \
            g++ \
            qt6-base-dev \
            qt6-base-dev-tools \
            gcovr

      - name: Configure calculator application
        run: >
          cmake -S instructor/Calculator_cmake
          -B build/calculator
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS=--coverage

      - name: Build calculator application and GUI tests
        run: cmake --build build/calculator --parallel

      - name: Run calculator GUI interaction tests
        run: ctest --test-dir build/calculator --output-on-failure -R CalculatorGuiTests

      - name: Configure unit tests
        run: >
          cmake -S instructor/Calculator_cmake/UnitTests
          -B build/calculator-tests
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS=--coverage

      - name: Build unit tests
        run: cmake --build build/calculator-tests --parallel

      - name: Run unit tests
        run: ctest --test-dir build/calculator-tests --output-on-failure

      - name: Generate code coverage reports
        run: |
          mkdir -p coverage
          gcovr --root . --object-directory build \
            --gcov-ignore-errors=no_working_dir_found \
            --filter 'common/Util.h' \
            --filter 'instructor/Calculator_cmake/mainwindow\\.cpp' \
            --exclude '.*Test_.*\\.cpp' \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --html-details coverage/index.html \
            --xml coverage/coverage.xml \
            --print-summary

      - name: Upload code coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: calculator-code-coverage
          path: coverage/
          if-no-files-found: error
