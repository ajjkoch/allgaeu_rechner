name: Calculator Android

on:
  push:
    branches:
      - feature/calculator-core-review
    paths:
      - "common/Util.h"
      - "instructor/Calculator_cmake/**"
      - ".github/workflows/calculator-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Android ARM64 APK
    runs-on: ubuntu-latest

    env:
      QT_VERSION: "6.8.3"
      ANDROID_NDK_VERSION: "26.1.10909125"
      ANDROID_PLATFORM: "android-35"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 ndk;26.1.10909125"

      - name: Install Qt for Android ARM64
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}/Qt
          cache: true

      - name: Configure Android build
        run: |
          "${QT_ROOT_DIR}/bin/qt-cmake" \
            -S instructor/Calculator_cmake \
            -B build/android-arm64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="${{ steps.install-qt.outputs.qt-host-path }}" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_HOME" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23

      - name: Build APK
        run: cmake --build build/android-arm64 --target apk --parallel

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find build/android-arm64 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced by the Android build." >&2
            find build/android-arm64 -maxdepth 6 -type d -print
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" dist/Calculator-Android-arm64-debug.apk
          echo "path=dist/Calculator-Android-arm64-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-android-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
