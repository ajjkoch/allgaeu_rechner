name: Calculator Android

on:
  push:
    branches:
      - main
      - refactor_design
      - refactor_dreiteilung
      - extend_calculator
      - use_ui_file
      - use_ui_file
    tags:
      - "v*"
    paths:
      - "common/Util.h"
      - "instructor/Calculator_cmake/**"
      - ".github/workflows/calculator-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Android ARM64 APK
    runs-on: ubuntu-latest

    env:
      QT_VERSION: "6.8.3"
      ANDROID_NDK_VERSION: "26.1.10909125"
      ANDROID_PLATFORM: "android-35"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use MAJOR.MINOR.PATCH: $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION ($VERSION)." >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125"

      - name: Install Qt for Android ARM64
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}/Qt
          cache: true

      - name: Configure Android build
        run: |
          "${QT_ROOT_DIR}/bin/qt-cmake" \
            -S instructor/Calculator_cmake \
            -B build/android-arm64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="${{ steps.install-qt.outputs.qt-host-path }}" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_HOME" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23

      - name: Build APK
        run: cmake --build build/android-arm64 --target apk --parallel

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find build/android-arm64 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced by the Android build." >&2
            find build/android-arm64 -maxdepth 6 -type d -print
            exit 1
          fi
          mkdir -p dist
          echo "path=dist/AllgaeuRechner-Android-arm64-${{ steps.version.outputs.version }}.apk" >> "$GITHUB_OUTPUT"
          echo "source=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Align and sign APK
        shell: bash
        env:
          APK_SOURCE: ${{ steps.apk.outputs.source }}
          APK_OUTPUT: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$ZIPALIGN" ] || [ ! -x "$APKSIGNER" ]; then
            echo "Android zipalign/apksigner tools not found in $BUILD_TOOLS" >&2
            exit 1
          fi

          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/calculator-debug.keystore" \
            -storetype PKCS12 \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$ZIPALIGN" -f -p 4 "$APK_SOURCE" "$RUNNER_TEMP/calculator-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/calculator-debug.keystore" \
            --ks-type PKCS12 \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$APK_OUTPUT" \
            "$RUNNER_TEMP/calculator-aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs "$APK_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-android-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AllgäuRechner ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
